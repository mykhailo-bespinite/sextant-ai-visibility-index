[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aeo-index"
dynamic = ["version"]
description = "Run the Sextant AI Visibility Index method with your own API keys: which tools do AI engines name first?"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Shearwater Labs" }]
keywords = ["aeo", "ai visibility", "answer engine optimization", "llm", "index"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-socket>=0.7"]

[project.scripts]
aeo-index = "aeo_index.cli:main"

[project.urls]
Homepage = "https://github.com/mykhailo-bespinite/sextant-ai-visibility-index"
Source = "https://github.com/mykhailo-bespinite/sextant-ai-visibility-index/tree/master/runner"

[tool.hatch.version]
path = "src/aeo_index/__init__.py"

[tool.hatch.build.targets.wheel]
# Every file inside the package ships, so the default question set
# (aeo_index/data/*.toml) and the recorded vendor bodies
# (aeo_index/fixtures/**) are package data with no extra lines.
packages = ["src/aeo_index"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", ".env.example", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# No test may reach the network. Unix sockets stay allowed: the asyncio
# event loop opens a socketpair to start.
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
