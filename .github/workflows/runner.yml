name: runner

# The code tests run only when the runner, the root README (which the leak
# guard reads) or the licences change; a data edition never runs them. A push
# runs them on master only, so a pull request's branch is tested once.
on:
  push:
    branches: [master]
    paths: ["runner/**", ".github/workflows/runner.yml", "README.md", "LICENSE", "LICENSE-DATA"]
  pull_request:
    paths: ["runner/**", ".github/workflows/runner.yml", "README.md", "LICENSE", "LICENSE-DATA"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e "runner[dev]"
      - name: Lint and format check
        run: |
          python -m pip install "ruff==0.17.1"
          ruff check runner
          ruff format --check runner
      - name: Private leak terms (only when the secret is set)
        env:
          LEAK_TERMS: ${{ secrets.AEO_INDEX_LEAK_TERMS }}
        run: |
          if [ -n "$LEAK_TERMS" ]; then
            printf '%s\n' "$LEAK_TERMS" > "$RUNNER_TEMP/leak-terms.txt"
            echo "AEO_INDEX_LEAK_TERMS=$RUNNER_TEMP/leak-terms.txt" >> "$GITHUB_ENV"
          fi
      - name: Test (network sockets disabled)
        run: pytest runner/tests -p no:cacheprovider --disable-socket
      - name: Build and check the distribution
        run: |
          python -m pip install "build==1.6.1" "twine==7.0.0"
          python -m build runner
          twine check --strict runner/dist/*
