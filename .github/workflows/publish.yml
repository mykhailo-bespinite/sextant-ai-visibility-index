name: publish

# Publishes the runner package to PyPI through a trusted publisher (no token
# in the repository). Fires on a release tag runner-v<version>; the tag must
# match runner/src/aeo_index/__init__.py::__version__ or the build step fails.
on:
  push:
    tags: ["runner-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#runner-v}"
          version="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("runner/src/aeo_index/__init__.py").read_text()).group(1))')"
          test "$tag" = "$version" || { echo "tag $tag != version $version"; exit 1; }
      - name: Build
        run: |
          python -m pip install --quiet build twine
          python -m build runner
          python -m twine check --strict runner/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: runner/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
